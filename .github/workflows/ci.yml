name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # nrwl/nx-set-shas finds the last successful run through the API on push events
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm nx format:check --all
      - run: pnpm nx affected -t lint test build typecheck build-storybook
